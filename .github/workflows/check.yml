name: Quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint, types and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Save coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: error
  build:
    name: Cloudflare production build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:worker
      - run: npm run test:worker
  smoke:
    name: Deployed site smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://llm-dictionary.tim-5f9.workers.dev' }}
  gate:
    name: Quality gate
    if: always()
    needs: [quality, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: test "$QUALITY" = success && test "$BUILD" = success && test "$SMOKE" = success
